name: Windows build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: x86
            runtime: win-x86
          - platform: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build application and unsigned MSIX
        run: >-
          dotnet build MouseKeeper.csproj --configuration Release
          --runtime ${{ matrix.runtime }}
          -p:Platform=${{ matrix.platform }}
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=true
